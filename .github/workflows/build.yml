name: Build ZenithDLC 1.21.11

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source ZIP
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          mkdir project
          unzip -q zenithdlc-2.0-source-1.2*.zip -d project

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZenithDLC-1.21.11
          path: project/build/libs/*.jar
