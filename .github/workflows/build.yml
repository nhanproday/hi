name: Build Minecraft 1.21.11

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft 1.21.11
    runs-on: ubuntu-24.04

    steps:

      # =========================================
      # CHECKOUT
      # =========================================
      - name: Checkout
        uses: actions/checkout@v7

      # =========================================
      # JAVA 21
      # =========================================
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # =========================================
      # GRADLE 9.2.1
      # Không dùng gradlew để tải Gradle nữa
      # =========================================
      - name: Setup Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'

      # =========================================
      # SHOW ENVIRONMENT
      # =========================================
      - name: Check environment
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "JAVA"
          echo "=============================="
          java -version

          echo ""
          echo "=============================="
          echo "GRADLE"
          echo "=============================="
          gradle --version

          echo ""
          echo "=============================="
          echo "FILES"
          echo "=============================="
          find . -maxdepth 2 -type f | sort

      # =========================================
      # FIND PROJECT
      # =========================================
      - name: Find project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          # Repository root
          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            # Search subdirectories
            BUILD_FILE=$(find . \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -not -path "./.git/*" \
              -print \
              -quit)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found."
            echo ""
            echo "Searching all files:"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="."
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # =========================================
      # VERIFY PROJECT
      # =========================================
      - name: Verify project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "PROJECT"
          echo "=============================="

          pwd
          ls -la

          echo ""
          echo "build.gradle:"
          if [ -f build.gradle ]; then
            cat build.gradle
          fi

          echo ""
          echo "gradle.properties:"
          if [ -f gradle.properties ]; then
            cat gradle.properties
          fi

      # =========================================
      # BUILD
      # =========================================
      - name: Build
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -o pipefail

          echo "=============================="
          echo "START BUILD"
          echo "=============================="

          gradle clean build \
            --no-daemon \
            --stacktrace \
            --info

      # =========================================
      # SHOW OUTPUT
      # =========================================
      - name: Show build output
        if: always()
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          echo "=============================="
          echo "BUILD OUTPUT"
          echo "=============================="

          if [ -d "build/libs" ]; then
            ls -lah build/libs
          else
            echo "build/libs was not created."
          fi

      # =========================================
      # UPLOAD JAR
      # =========================================
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ZenithDLC-1.21.11
          path: ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          compression-level: 9
