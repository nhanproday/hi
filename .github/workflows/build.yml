name: Build Minecraft 1.21.11

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft 1.21.11
    runs-on: ubuntu-24.04

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v7

      # ==========================================
      # JAVA 21
      # ==========================================
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # ==========================================
      # GRADLE ACTION
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # ==========================================
      # FIND PROJECT
      # ==========================================
      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for Gradle project..."
          echo "======================================"

          PROJECT_DIR=""

          # --------------------------------------
          # Case 1: gradlew already exists
          # --------------------------------------
          FOUND=$(find . \
            -type f \
            -name "gradlew" \
            -not -path "./.git/*" \
            -print \
            -quit)

          if [ -n "$FOUND" ]; then
            PROJECT_DIR=$(dirname "$FOUND")
            echo "Found gradlew:"
            echo "$FOUND"
          fi

          # --------------------------------------
          # Case 2: source ZIP exists
          # --------------------------------------
          if [ -z "$PROJECT_DIR" ]; then

            echo ""
            echo "No gradlew found."
            echo "Searching for source ZIP..."

            SOURCE_ZIP=$(find . \
              -type f \
              \( -name "*.zip" -o -name "*.ZIP" \) \
              -not -path "./.git/*" \
              -print \
              -quit)

            if [ -n "$SOURCE_ZIP" ]; then

              echo "Found ZIP:"
              echo "$SOURCE_ZIP"

              rm -rf project
              mkdir -p project

              unzip -q "$SOURCE_ZIP" -d project

              FOUND=$(find project \
                -type f \
                -name "gradlew" \
                -print \
                -quit)

              if [ -n "$FOUND" ]; then
                PROJECT_DIR=$(dirname "$FOUND")
                echo "Extracted project:"
                echo "$PROJECT_DIR"
              fi
            fi
          fi

          # --------------------------------------
          # Verify project
          # --------------------------------------
          if [ -z "$PROJECT_DIR" ]; then
            echo ""
            echo "ERROR: Could not find Gradle project."
            echo ""
            echo "Files in repository:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          # Normalize path
          PROJECT_DIR="${PROJECT_DIR#./}"

          if [ "$PROJECT_DIR" = "" ]; then
            PROJECT_DIR="."
          fi

          echo ""
          echo "======================================"
          echo "PROJECT DIRECTORY"
          echo "======================================"
          echo "$PROJECT_DIR"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # ==========================================
      # CHECK PROJECT
      # ==========================================
      - name: Verify project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PROJECT FILES"
          echo "======================================"

          pwd
          ls -la

          echo ""
          echo "Gradle wrapper:"
          ls -la gradlew

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle wrapper version:"
          bash gradlew --version

      # ==========================================
      # FIX GRADLE WRAPPER
      # ==========================================
      - name: Prepare Gradle wrapper
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          # Remove Windows CRLF if present
          sed -i 's/\r$//' gradlew

          echo "Gradle wrapper prepared."
          ls -la gradlew

      # ==========================================
      # BUILD
      # ==========================================
      - name: Build
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "STARTING BUILD"
          echo "======================================"

          bash gradlew clean build \
            --no-daemon \
            --stacktrace

      # ==========================================
      # SHOW OUTPUT
      # ==========================================
      - name: Show build output
        if: always()
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          echo "======================================"
          echo "BUILD OUTPUT"
          echo "======================================"

          if [ -d "build/libs" ]; then
            ls -lah build/libs
          else
            echo "build/libs does not exist."
          fi

      # ==========================================
      # UPLOAD JAR
      # ==========================================
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ZenithDLC-1.21.11
          path: ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          compression-level: 9
