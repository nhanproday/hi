name: Build ZenithDLC 1.21.11

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          mkdir project
          unzip -q zenithdlc-2.0-source-1.2*.zip -d project

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find project
        run: |
          echo "Searching for Gradle project..."
          find project -name gradlew -type f

      - name: Build
        run: |
          PROJECT_DIR=$(dirname "$(find project -name gradlew -type f | head -1)")
          echo "Project: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZenithDLC-1.21.11
          path: project/**/build/libs/*.jar
